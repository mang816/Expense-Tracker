server.port=${PORT:8081}
spring.application.name=expense-tracker

# Database Configuration (Uses Render environment variables if present, otherwise falls back to localhost)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/expense_tracker?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Nathanael.a1}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

jwt.secret=super-secret-jwt-key-for-expense-tracker-2026
jwt.expiration-ms=86400000

logging.level.org.flywaydb=DEBUG