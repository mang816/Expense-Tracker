<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        .auth-title {
            width: fit-content;
            margin: 40px auto 24px;
        }

        .auth-card {
            margin-top: 0;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 70px;
        }

        .password-wrap .toggle-password {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            width: auto;
            margin: 0;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 600;
            background: transparent;
            color: #4f46e5;
            box-shadow: none;
        }

        .password-wrap .toggle-password:hover {
            background: rgba(99, 102, 241, 0.1);
            transform: translateY(-50%);
            box-shadow: none;
        }

        .form-note {
            font-size: 13px;
            text-align: left;
            margin: 0 0 15px;
        }
    </style>

</head>

<body>

<div class="container">

    <h1 class="auth-title">My Expense Tracker</h1>

    <div class="form-card auth-card">

        <h2>Create your account</h2>

        <p class="form-note error" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/register}" th:object="${user}" method="post">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" th:field="*{username}" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input type="password" th:field="*{password}" required>
                    <button type="button" class="toggle-password" data-target="password">Show</button>
                </div>
            </div>

            <button type="submit">Create Account</button>

        </form>

        <p class="auth-switch">
            Already have an account? <a href="/login">Login</a>
        </p>

    </div>

</div>

<script>
    document.querySelectorAll('.toggle-password').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var input = document.getElementById(btn.getAttribute('data-target'));
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.textContent = show ? 'Hide' : 'Show';
        });
    });
</script>

</body>

</html>
